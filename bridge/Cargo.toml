[package]
name = "kaspa-stratum-bridge"
description = "RKstratum Kas+ZKAS click-run solo stratum (in-process nodes, locked 1% fee)"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Kaspa dependencies - using workspace versions
kaspa-consensus-core = { workspace = true }
kaspa-hashes = { workspace = true }
kaspa-pow = { workspace = true }
kaspa-addresses = { workspace = true }
kaspa-rpc-core = { workspace = true }
kaspa-rpc-service = { workspace = true }
kaspa-grpc-client = { workspace = true }
kaspa-grpc-core = { workspace = true }
kaspa-merkle = { workspace = true }
kaspa-notify = { workspace = true }
kaspa-core = { workspace = true }
kaspa-utils = { workspace = true }
kaspad = { workspace = true }
kaspa-alloc = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }

# External dependencies - using workspace versions where available
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
num-traits = { workspace = true }
async-trait = { workspace = true }
once_cell = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }

# External dependencies not in workspace (add specific versions)
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
blake2 = "0.10"
num-bigint = "0.4"
prometheus = "0.13"
serde_yaml = "0.9"
faster-hex = "0.1"
chrono = { workspace = true }
include_dir = "0.7"
sysinfo = { workspace = true, optional = true }
# Always available: geoip + zkas_merged auto-consolidate HTTP client.
ureq = { version = "2.12", default-features = false, features = ["json"] }
borsh = "1.5"
async-stream = "0.3"
prost = "0.14"
bytes = "1"
tonic = { version = "0.14", features = ["gzip", "transport"] }
tonic-prost = "0.14"
async-channel = "2.3"
http = "1"

# ZKas node linked in-process so merged mining needs no second executable.
# Sourced from firecash/zkas-rusty (not a local _vendor path). Pin a published
# release tag — see bridge/docs/UPSTREAM-UPDATES.md. `heap` suppresses this
# copy's `#[global_allocator]` (Rusty-Kaspa already provides mimalloc).
# `wallet-api` embeds zkas-walletd for auto-consolidate.
zkas_kaspad = { package = "kaspad", git = "https://github.com/firecash/zkas-rusty.git", tag = "zkas-v1.0.5", default-features = false, features = ["heap", "wallet-api"] }
zkas_kaspa_core = { package = "kaspa-core", git = "https://github.com/firecash/zkas-rusty.git", tag = "zkas-v1.0.5" }
zkas_kaspa_utils = { package = "kaspa-utils", git = "https://github.com/firecash/zkas-rusty.git", tag = "zkas-v1.0.5" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }

# For musl builds, we declare mimalloc without 'override' to override kaspa-alloc's version
# Workspace `.cargo/config.toml` musl rustflags handle any remaining link conflicts
[target.'cfg(all(not(target_os = "macos"), target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1.48", default-features = false }


[[bin]]
name = "RKstratumKasZkasSolo"
path = "src/main.rs"

[features]
# Host metrics (sysinfo) + geo client (ureq) are on by default. Geo HTTP lookup is off until approximate_geo_lookup is enabled (config/CLI/API).
# Minimal binary: cargo build -p kaspa-stratum-bridge --no-default-features
default = ["rkstratum_geoip"]
rkstratum_cpu_miner = []
rkstratum_host_metrics = ["dep:sysinfo"]
rkstratum_geoip = ["rkstratum_host_metrics"]

[lints]
workspace = true
